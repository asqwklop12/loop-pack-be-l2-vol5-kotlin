server:
  port: 8082
  shutdown: graceful

spring:
  main:
    web-application-type: servlet
  application:
    name: pg-simulator
  profiles:
    active: local
  config:
    import:
      - logging.yml

management:
  endpoints:
    web:
      exposure:
        include: health, info

pg:
  callback-url: ${PG_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}
  callback-delay: ${PG_CALLBACK_DELAY:3s}
  decline-rate: ${PG_DECLINE_RATE:0.0}
  callback-drop-rate: ${PG_CALLBACK_DROP_RATE:0.0}
