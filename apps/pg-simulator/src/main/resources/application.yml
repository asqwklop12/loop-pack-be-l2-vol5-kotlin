server:
  port: 8082
  shutdown: graceful

spring:
  main:
    web-application-type: servlet
  application:
    name: pg-simulator
  profiles:
    active: local
  config:
    import:
      - logging.yml

management:
  endpoints:
    web:
      exposure:
        include: health, info

pg:
  callback-url: ${PG_CALLBACK_URL:http://localhost:8080/api/v1/payments/callback}
  callback-delay: ${PG_CALLBACK_DELAY:3s}
  slow-card-delay: ${PG_SLOW_CARD_DELAY:10s}
  response-delay: ${PG_RESPONSE_DELAY:0s}
  decline:
    limit-exceeded: ${PG_DECLINE_LIMIT_EXCEEDED:0.005}
    insufficient-balance: ${PG_DECLINE_INSUFFICIENT_BALANCE:0.005}
    lost-or-stolen: ${PG_DECLINE_LOST_OR_STOLEN:0.001}
    issuer-unavailable: ${PG_DECLINE_ISSUER_UNAVAILABLE:0.0}
  callback-drop-rate: ${PG_CALLBACK_DROP_RATE:0.0}
