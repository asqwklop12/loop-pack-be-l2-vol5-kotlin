name: loopers-pg

services:
  pg-simulator:
    build:
      context: ../apps/pg-simulator
    container_name: pg-simulator
    ports:
      - "8082:8082"
    environment:
      - PG_CALLBACK_URL=${PG_CALLBACK_URL:-http://host.docker.internal:8080/api/v1/payments/callback}
      - PG_CALLBACK_DELAY=${PG_CALLBACK_DELAY:-3s}
      - PG_DECLINE_RATE=${PG_DECLINE_RATE:-0.0}
      - PG_CALLBACK_DROP_RATE=${PG_CALLBACK_DROP_RATE:-0.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 2s
      retries: 10
